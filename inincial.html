<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capa - Portfólio Coquette</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cormorant Garamond', serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('tela.jpg') no-repeat center center/cover; /* aqui está a imagem */
      text-align: center;
      position: relative;
    }

    /* Overlay para deixar o texto legível */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.6);
    }

    .conteudo {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem;
      color: #a67873;
      margin-bottom: 1rem;
    }

    .subtitulo {
      font-family: 'Raleway', sans-serif; /* fonte mais limpa */
      font-size: 1.5rem;
      color: #4a3f35;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.2rem;
      color: #4a3f35;
      margin: 0.5rem 0;
    }

    .btn-vintage {
      display: inline-block;
      background-color: #f3e5dc;
      color: #4a3f35;
      padding: 10px 20px;
      border: 2px solid #c9b7a6;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 2rem;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn-vintage:hover {
      background-color: #e8d5c4;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="conteudo">
    <h1>Portfólio Coquette</h1>
    <p class="subtitulo">Trabalho de Desenvolvimento</p>
    <p>Isabela - 2026</p>
    <a href="index.html" class="btn-vintage">Entrar</a>
  </div>
</body>
</html>
